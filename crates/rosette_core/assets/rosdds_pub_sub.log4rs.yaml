refresh_rate: 10 s

appenders:
  stdout:
    kind: console
  file_appender:
    kind: file
    path: "./result/rosdds_pub_sub.log4rs.log"
root:
  level: info
  appenders:
    - stdout
    - file_appender

loggers:
  rustdds:
    level: warn
  rustdds::dds::message_receiver:
    level: info
  rustdds::dds::fragment_assembler:
      level: warn
  rustdds::dds::with_key::datareader:
    level: info
  rustdds::dds::writer:
    level: info
  rustdds::dds::datasample_cache:
    level: debug
